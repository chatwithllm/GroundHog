# BLDC5520 x2 skid-steer bench — NodeMCU ESP8266 (WiFi dashboard)
# LEFT : blue=PWM->D5, yellow=CW/CCW->D6(via 1k), green=FG->D7(via 10k/22k divider)
# RIGHT: blue=PWM->D1, yellow=CW/CCW->D2(via 1k)   [no FG - out of clean pins]
# 5V driver signals: NEVER wire FG/CW-CCW straight to a pin (1k series / divider only).
# Blade (motor 3) intentionally NOT here - needs failsafe+e-stop, goes on the F405.
esphome:
  name: bldc-esp8266
  friendly_name: BLDC ESP8266

esp8266:
  board: nodemcuv2

logger:
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "BLDC-8266"
    password: "bench1234"
captive_portal:

output:
  - platform: esp8266_pwm
    pin: D5
    frequency: 20000 Hz
    id: pwm_left
    inverted: true
  - platform: esp8266_pwm
    pin: D1
    frequency: 20000 Hz
    id: pwm_right
    inverted: true

number:
  - platform: template
    name: "Left Speed %"
    id: spd_left
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 0
    restore_value: false
    set_action:
      - output.set_level: { id: pwm_left, level: !lambda "return x/100.0;" }
  - platform: template
    name: "Right Speed %"
    id: spd_right
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 0
    restore_value: false
    set_action:
      - output.set_level: { id: pwm_right, level: !lambda "return x/100.0;" }

switch:
  - platform: gpio
    name: "Left Direction"
    pin: D6
  - platform: gpio
    name: "Right Direction"
    pin: D2
  - platform: template
    name: "STOP ALL"
    turn_on_action:
      - number.set: { id: spd_left, value: 0 }
      - number.set: { id: spd_right, value: 0 }

sensor:
  - platform: pulse_counter
    pin:
      number: D7
      mode: { input: true, pullup: true }
    name: "Left FG"
    update_interval: 1s
    unit_of_measurement: "pulses/min"
