# BLDC5520 bench test — NodeMCU ESP32 (WROOM-32)
# Wire (CONFIRMED): red=VCC->pack24V, black=GND->common,
#   blue=PWM->GPIO25, yellow=CW/CCW->GPIO26, green=FG->GPIO27
# ESP powered by USB. Wheels up. Blade never first.
esphome:
  name: bldc-esp32
  friendly_name: BLDC ESP32

esp32:
  board: esp32dev            # generic WROOM-32 / NodeMCU-32S
  framework:
    type: arduino

logger:
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "BLDC-ESP32"
    password: "bench1234"
captive_portal:

# --- PWM speed (blue -> GPIO25) ---  driver is active-low, so invert -> 0%=stop
output:
  - platform: ledc
    id: motor_pwm
    pin: GPIO25
    frequency: 20000 Hz
    inverted: true

number:
  - platform: template
    name: "Motor Speed %"
    id: motor_speed
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - output.set_level:
          id: motor_pwm
          level: !lambda "return x / 100.0;"

# --- Direction (yellow -> GPIO26) ---
switch:
  - platform: gpio
    name: "Direction CW-CCW"
    id: motor_dir
    pin: GPIO26
  - platform: template
    name: "STOP"
    turn_on_action:
      - number.set:
          id: motor_speed
          value: 0

# --- FG feedback (green -> GPIO27) ---
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    name: "FG frequency"
    id: motor_fg
    unit_of_measurement: "pulses/min"
    update_interval: 1s
