<style>.wrap{max-width:1050px;margin:0 auto;padding:18px}
.board{background:#f7f6ef;border:14px solid #d9d2c4;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 0 60px rgba(0,0,0,.04);position:relative;overflow:hidden}

:root[data-theme="light"] body,:root:not([data-theme="dark"]) body{}
@media(prefers-reduced-motion:reduce){.draw,.dash{stroke-dashoffset:0;animation:none}.pop{opacity:1;animation:none}}

<div class="wrap">
<h1>RTK Rover &mdash; Architecture</h1>
<p class="cap">A pool-cleaner reborn: RTK corrections flow in from the base, the F405 (ArduRover) fuses GPS + IMU + wheel-speed (FG) and steers, driving the BLDC motors directly with PWM + DIR &mdash; all off the salvaged 24V pack. Watch it draw itself.</p>
